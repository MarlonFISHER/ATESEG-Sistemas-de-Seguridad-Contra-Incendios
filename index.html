<html lang="es">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;

            padding: 25px 10px;

        .container {

        /* Botones del Hero (Brochure e Instalación) */

            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-brochure {
            display: inline-block;

            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-brochure:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(204, 0, 0, 0.5); color: #ffffff; }

        .btn-installation {

            color: #ffffff;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-installation:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 211, 102, 0.5); color: #ffffff; }

        .stat-number { font-family: 'Oswald', sans-serif; font-size: 1.8rem; color: #cc0000; font-weight: 700; line-height: 1.1; margin-bottom: 4px; }

        /* VISOR DE PDF */
        .pdf-container { width: 100%; height: 600px; border-radius: 8px; overflow: hidden; border: 2px solid #dddddd; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background-color: #f9f9f9; }

        .product-img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; border-radius: 6px; background-color: #f9f9f9; padding: 10px; border: 1px solid #eeeeee; }
        .product-card h3 { font-family: 'Oswald', sans-serif; font-size: 1.25rem; color: #111111; margin-bottom: 8px; text-transform: uppercase; }
        .product-card p.desc { font-size: 0.9rem; color: #555555; margin-bottom: 15px; flex-grow: 1; }
        .product-card p.availability { font-size: 0.85rem; color: #cc0000; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; }
        .btn-quote { display: inline-block; background-color: #25d366; color: #ffffff; padding: 10px 15px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 0.95rem; transition: background-color 0.2s ease; }
        .btn-quote:hover { background-color: #20bd5a; }

        .contact-buttons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 15px; }
        .btn-contact { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 15px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; text-decoration: none; color: #ffffff; transition: transform 0.2s ease; }
        .btn-contact:hover { transform: translateY(-2px); }
        .btn-whatsapp { background-color: #25d366; }
        .btn-call { background-color: #cc0000; }
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        /* Buscador */
        .search-box { margin-bottom: 25px; text-align: center; }

        .search-box input:focus { border-color: #cc0000; }
